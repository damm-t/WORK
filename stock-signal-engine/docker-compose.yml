services:
  quant-desk:
    build: .
    container_name: quant-desk-247
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8095:8095"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./.run:/app/.run
    environment:
      - NO_BROWSER=1